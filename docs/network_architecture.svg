<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1420" height="800" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="52" font-size="30" font-weight="bold" fill="#111">AQMS network architecture</text>
  <text x="30" y="82" font-size="16" fill="#444">Sensors: SHT45, SGP40, Grove MGSv2 (CO, NO2), MQ131 (O3), SPS30  |  Sampling: 30 s</text>

  <!-- Legend -->
  <rect x="1218" y="28" width="172" height="36" fill="#ffffff" stroke="#999"/>
  <line x1="1232" y1="46" x2="1272" y2="46" stroke="#222" stroke-width="2"/>
  <text x="1282" y="51" font-size="16" fill="#111">Data flow</text>

  <!-- Dashed container: the seven nodes -->
  <text x="34" y="130" font-size="17" font-weight="bold" fill="#111">Seven low-cost nodes - QMUL Mile End + King Edward Memorial Park</text>
  <rect x="30" y="140" width="660" height="560" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="7,5"/>

  <!-- Replication note -->
  <text x="345" y="185" font-size="15" fill="#333">
    <tspan x="345" dy="0">&#215;7 nodes with the same architecture</tspan>
    <tspan x="345" dy="20">(indoor/outdoor pairs: 1&#8596;2, 3&#8596;4, 6&#8596;7;</tspan>
    <tspan x="345" dy="20">nodes 3 and 5 add Alphasense NO2/O3/CO</tspan>
    <tspan x="345" dy="20">cells via additional ADS1115 ADCs)</tspan>
  </text>

  <!-- Sensor boxes -->
  <g stroke="#9c7c3c" stroke-width="2" fill="#fdf6e3">
    <rect x="55" y="175" width="230" height="58" rx="3"/>
    <rect x="55" y="255" width="230" height="58" rx="3"/>
    <rect x="55" y="335" width="230" height="58" rx="3"/>
    <rect x="55" y="415" width="230" height="58" rx="3"/>
    <rect x="55" y="495" width="230" height="58" rx="3"/>
    <rect x="55" y="585" width="230" height="58" rx="3"/>
  </g>
  <g font-size="15" fill="#111" text-anchor="middle">
    <text x="170" y="199">SHT45<tspan x="170" dy="20">Temp (&#176;C), RH (%)</tspan></text>
    <text x="170" y="279">SGP40<tspan x="170" dy="20">VOC index, raw</tspan></text>
    <text x="170" y="359">Grove MGSv2<tspan x="170" dy="20">CO raw, NO2 raw</tspan></text>
    <text x="170" y="439">SPS30<tspan x="170" dy="20">PM2.5, PM10</tspan></text>
    <text x="170" y="519">MQ131 (O3)<tspan x="170" dy="20">raw, voltage</tspan></text>
    <text x="170" y="609">ADS1115 (0x48)<tspan x="170" dy="20">Gain = 2/3</tspan></text>
  </g>
  <!-- MQ131 -> ADS1115 -->
  <line x1="170" y1="553" x2="170" y2="581" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Node box -->
  <rect x="390" y="330" width="280" height="220" rx="4" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="530" y="356" font-size="15" font-weight="bold" fill="#1a365d" text-anchor="middle">Low-cost node<tspan x="530" dy="19">(Raspberry Pi Zero 2 W)</tspan></text>
  <rect x="405" y="400" width="100" height="38" rx="3" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="455" y="424" font-size="15" fill="#111" text-anchor="middle">I2C bus</text>
  <rect x="515" y="392" width="140" height="56" rx="3" fill="#e6faf3" stroke="#0d9488" stroke-width="2"/>
  <text x="585" y="415" font-size="14" fill="#111" text-anchor="middle">InfluxDB client<tspan x="585" dy="19">synchronous write</tspan></text>
  <rect x="425" y="468" width="210" height="62" rx="3" fill="#fdf0f0" stroke="#c53030" stroke-width="2"/>
  <text x="530" y="493" font-size="14" fill="#111" text-anchor="middle">Local SQLite buffer<tspan x="530" dy="19">measurements (synced 0/1)</tspan></text>

  <!-- Sensor -> I2C arrows -->
  <g stroke="#222" stroke-width="2">
    <line x1="285" y1="204" x2="401" y2="410" marker-end="url(#arr)"/>
    <line x1="285" y1="284" x2="401" y2="414" marker-end="url(#arr)"/>
    <line x1="285" y1="364" x2="401" y2="418" marker-end="url(#arr)"/>
    <line x1="285" y1="444" x2="401" y2="424" marker-end="url(#arr)"/>
    <line x1="285" y1="614" x2="401" y2="432" marker-end="url(#arr)"/>
  </g>

  <!-- Node -> Network -->
  <line x1="670" y1="437" x2="756" y2="437" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <text x="713" y="425" font-size="14" fill="#333" text-anchor="middle">Line Protocol</text>
  <rect x="760" y="397" width="200" height="80" rx="3" fill="#eef2f6" stroke="#4a5568" stroke-width="2"/>
  <text x="860" y="430" font-size="15" fill="#111" text-anchor="middle">Network / VPN<tspan x="860" dy="20">Wi-Fi or Ethernet</tspan></text>

  <!-- Network -> Server -->
  <line x1="960" y1="437" x2="1016" y2="437" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="1020" y="365" width="340" height="150" rx="4" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="1190" y="395" font-size="18" font-weight="bold" fill="#1a365d" text-anchor="middle">InfluxDB server</text>
  <rect x="1045" y="412" width="290" height="62" rx="3" fill="#e6faf3" stroke="#0d9488" stroke-width="2"/>
  <text x="1190" y="437" font-size="15" fill="#111" text-anchor="middle">InfluxDB (OSS v2.x)<tspan x="1190" dy="20">Retention policy: none</tspan></text>

  <!-- Server -> Analysis / Grafana -->
  <line x1="1110" y1="515" x2="960" y2="606" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1250" y1="515" x2="1250" y2="606" stroke="#222" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="790" y="610" width="290" height="78" rx="3" fill="#fdf6e3" stroke="#9c7c3c" stroke-width="2"/>
  <text x="935" y="642" font-size="15" fill="#111" text-anchor="middle">Analysis (Python / notebooks)<tspan x="935" dy="20">CSV export</tspan></text>
  <rect x="1110" y="610" width="280" height="78" rx="3" fill="#fdf6e3" stroke="#9c7c3c" stroke-width="2"/>
  <text x="1250" y="642" font-size="15" fill="#111" text-anchor="middle">Grafana (optional)<tspan x="1250" dy="20">Dashboards / QA-QC</tspan></text>

  <!-- Footer -->
  <text x="30" y="750" font-size="14" fill="#444">
    <tspan x="30" dy="0">Each measurement carries fields (values) and tags (metadata): node_id, site, subsite, exposure, environment,</tspan>
    <tspan x="30" dy="20">latitude, longitude, sensor_model, sensor_cost. No retention policy is applied in InfluxDB.</tspan>
  </text>
</svg>
